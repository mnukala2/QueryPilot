name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=querypilot --cov-report=term-missing --cov-fail-under=85
      - name: Offline evals (guardrails, retrieval, prompt size)
        run: python eval/offline_eval.py --json results/offline.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-eval
          path: results/offline.json
